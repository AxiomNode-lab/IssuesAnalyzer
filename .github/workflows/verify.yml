name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: opportunity_radar_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opportunity_radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opportunity_radar_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source files
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/globals.css \
            apps/web/src/app/page.tsx \
            apps/web/src/components/analysis-report.tsx \
            apps/web/src/components/issue-analyzer.tsx \
            packages/actionability-analyzer/src/index.ts \
            packages/competition-analyzer/src/index.ts \
            packages/responsiveness-analyzer/src/index.ts \
            packages/responsiveness-analyzer/src/index.test.ts \
            packages/scoring-engine/src/index.ts \
            packages/scoring-engine/src/index.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/web/src/app/globals.css \
              apps/web/src/app/page.tsx \
              apps/web/src/components/analysis-report.tsx \
              apps/web/src/components/issue-analyzer.tsx \
              packages/actionability-analyzer/src/index.ts \
              packages/competition-analyzer/src/index.ts \
              packages/responsiveness-analyzer/src/index.ts \
              packages/responsiveness-analyzer/src/index.test.ts \
              packages/scoring-engine/src/index.ts \
              packages/scoring-engine/src/index.test.ts
            git commit -m "style: apply repository formatting"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify formatting, lint, types, tests, and build
        run: pnpm verify

      - name: Validate operational scripts
        run: sh -n scripts/smoke-test.sh scripts/backup-postgres.sh scripts/restore-postgres.sh

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Verify PostgreSQL schema and constraints
        run: sh packages/database/scripts/test-integration.sh

      - name: Audit production dependencies
        run: pnpm audit --prod
