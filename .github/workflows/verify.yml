name: Verify

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Format auth work
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format auth work
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/api/account/delete/route.ts \
            apps/web/src/app/api/auth/github/callback/route.ts \
            apps/web/src/app/api/saved/[id]/route.ts \
            apps/web/src/app/api/saved/route.ts \
            apps/web/src/lib/auth.test.ts \
            apps/web/src/lib/auth.ts \
            apps/web/src/lib/database.ts

      - name: Commit formatting when changed
        run: |
          if git diff --quiet; then
            echo "Formatting already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/app/api/account/delete/route.ts \
            apps/web/src/app/api/auth/github/callback/route.ts \
            apps/web/src/app/api/saved/[id]/route.ts \
            apps/web/src/app/api/saved/route.ts \
            apps/web/src/lib/auth.test.ts \
            apps/web/src/lib/auth.ts \
            apps/web/src/lib/database.ts
          git commit -m "style: format auth and saved report code"
          git push origin HEAD:${{ github.head_ref }}
