name: Format PR 65

on:
  push:
    branches:
      - fix/scoring-v4-benchmark-gaps

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/scoring-v4-benchmark-gaps

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.23.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format affected files
        run: pnpm exec prettier --write packages/actionability-analyzer/src/index.ts packages/competition-analyzer/src/index.ts packages/scoring-engine/src/index.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/actionability-analyzer/src/index.ts packages/competition-analyzer/src/index.ts packages/scoring-engine/src/index.ts
          git commit -m "style: format scoring benchmark fixes"
          git push origin HEAD:fix/scoring-v4-benchmark-gaps
